# 5g rather than 3. Packaging is the peak, not compilation: zipflinger reads each entry whole, and
# with parallel workers several native libraries of tens of megabytes are resident at once. Three
# gigabytes died in PackageAndroidArtifact on a CI runner that had plenty of memory left to give.
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
