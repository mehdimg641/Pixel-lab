name: build

# On every push and every pull request. A check that only runs on one branch is a check that
# discovers a break after it has already been merged.
on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch cancels the first. The older run is testing code nobody will
# merge, and on a shared runner pool it is delaying the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 21 to run Gradle and the pure modules; the Android modules target bytecode 17 through the
      # toolchain, so one JDK covers both.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `build` runs assemble and every test in one pass. Splitting them into separate steps looks
      # tidier and costs a second full configuration of a twelve-module project.
      - name: Build and test
        run: ./gradlew build --stacktrace

      # Always, because a failed run is exactly when the reports are wanted. Uploading only on
      # success gets them for the runs nobody needs to read.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14

      # The screenshot tests and the 3D sample renders write real pictures. They are the only way
      # to look at this app's output from a build machine, so they leave the run with it.
      - name: Upload rendered samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-samples
          path: |
            app/android/build/screenshots/**
            core/mesh/build/renders/**
            core/imaging/build/reports/filter-benchmark.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/android/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore
