name: build

# Pushes to the default branch, and every pull request.
#
# Deliberately *not* `push: branches: ["**"]` alongside `pull_request:`. Both fire for a branch
# with a pull request open, and no concurrency group can merge them: a `push` event carries no
# `pull_request.number`, so any expression that falls back to the ref puts the two in different
# groups and the whole build runs twice for every commit. Restricting the push trigger is the only
# thing that actually stops it. The cost is that a branch with no pull request open gets no CI,
# which is the standard trade and the reason opening the PR early is worth doing.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. The older run is testing code nobody will
# merge, and on a shared runner pool it is delaying the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read to check out, write to publish the preview release. Stated here rather than left to the
# repository default, because the default is read-only and the release step would fail with a 403
# that looks like a bug in the step rather than a missing permission.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 21 to run Gradle and the pure modules; the Android modules target bytecode 17 through the
      # toolchain, so one JDK covers both.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `build` runs assemble and every test in one pass. Splitting them into separate steps looks
      # tidier and costs a second full configuration of a twelve-module project.
      - name: Build and test
        run: ./gradlew build --stacktrace

      # Always, because a failed run is exactly when the reports are wanted. Uploading only on
      # success gets them for the runs nobody needs to read.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14

      # The screenshot tests and the 3D sample renders write real pictures. They are the only way
      # to look at this app's output from a build machine, so they leave the run with it.
      - name: Upload rendered samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-samples
          path: |
            app/android/build/screenshots/**
            core/mesh/build/renders/**
            core/imaging/build/reports/filter-benchmark.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/android/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore

      # A tap-to-install link, which the artifact above is not.
      #
      # A workflow artifact is always a zip — of all three ABIs, 86 MB — and it is only reachable
      # from the Actions page while signed in. Neither of those works on the device the app is
      # actually for: a phone browser will not unpack a zip, and the person testing the build should
      # not have to go looking for a run ID. A release asset is a single file at a stable address.
      #
      # Only the debug APKs. A release build on a runner is unsigned — there is no keystore here and
      # deliberately so, since the key must be one only its owner holds — and Android refuses to
      # install an unsigned package. Publishing one would be handing over a file that cannot work.
      #
      # `preview` is a rolling tag: deleted and recreated so it always points at the commit that
      # produced the binaries. A tag left behind on an old commit describing new files is worse than
      # no tag, because it is wrong rather than missing.
      - name: Publish the preview build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --cleanup-tag --yes || true
          gh release create preview \
            --prerelease \
            --title "پیش‌نمایش — ${GITHUB_SHA:0:7}" \
            --notes "بیلد دیباگ از \`${GITHUB_SHA:0:7}\`. برای گوشی معمولی فایل **arm64-v8a** را بگیرید؛ اگر نصب نشد، **armeabi-v7a**." \
            app/android/build/outputs/apk/debug/*.apk
